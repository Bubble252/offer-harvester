name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r app/backend/requirements.txt ruff
      - name: Lint Python
        run: ruff check .
      - name: Check Python formatting
        run: ruff format --check .
      - name: Run security guards
        run: python tools/security_guards.py
      - name: Lint docs
        run: python tools/lint_docs.py
      - name: Run tests
        run: pytest -q
