[project]
name = "grad-apply-workflow"
version = "0.1.0"
description = "Local-first graduate application workflow assistant."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "python-multipart",
    "python-pptx==0.6.23",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
train = [
    "accelerate",
    "datasets",
    "peft",
    "torch",
    "transformers",
    "trl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "app/backend",
    ".",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "workspace",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"app/backend/main.py" = ["E402"]
"tests/test_services.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
