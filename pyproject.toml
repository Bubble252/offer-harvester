[project]
name = "offer-harvester"
version = "0.2.0rc1"
description = "Local-first, evidence-governed graduate application workflow assistant."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic>=2,<3",
    "python-multipart",
    "python-pptx==0.6.23",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
train = [
    "accelerate>=0.34",
    "datasets>=2.21",
    "peft>=0.13,<0.14",
    "pydantic>=2,<3",
    "torch>=2.5,<2.6",
    "transformers>=4.46,<4.47",
    "trl>=0.15,<0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "app/backend",
    ".",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "workspace",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"app/backend/main.py" = ["E402"]
"tests/test_services.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
